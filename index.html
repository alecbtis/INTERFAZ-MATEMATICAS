<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Estudio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap');

    :root{
      --bg:#0f1216;
      --panel:#171b21;
      --line:#2a313a;
      --text:#e8edf2;
      --muted:#9aa6b2;
      --accent:#5aa9e6;
    }

    *{box-sizing:border-box}

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel {
      width: 380px;
      background: var(--panel);
      border-radius: 10px;
      padding: 28px;
      border: 1px solid var(--line);
      position: relative;
    }

    /* línea distintiva */
    .panel::topline{content:none}
    .panel::before{
      content:"";
      position:absolute;
      top:0;left:0;
      width:100%;height:2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4em;
      margin-bottom: 18px;
      letter-spacing: 0.5px;
    }

    .screen {
      font-size: 0.85em;
      color: var(--muted);
      margin-bottom: 15px;
    }

    .btn {
      display: block;
      width: 100%;
      margin: 6px 0;
      padding: 12px 10px;
      border-radius: 6px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      text-decoration: none;
      font-size: 0.9em;
      transition: 0.2s;
    }

    .btn:hover {
      border-color: var(--accent);
      color: white;
      background: rgba(90,169,230,0.08);
    }

    .section {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .section-title {
      font-size: 0.7em;
      color: var(--muted);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .names {
      white-space: pre-line;
      font-size: 0.9em;
      line-height: 1.6em;
      color: #d6dde5;
    }

  </style>
</head>
<body>
  <div class="panel">
    <h1>Sistema de Estudio</h1>

    <div class="screen">
      Selecciona un módulo
    </div>

    <a href="https://gemini.google.com/gem/1Kva1Z1QOKQVlTr-Xh2sLRQslm0sZrTPE?usp=sharing&authuser=0" target="_blank" class="btn">Tutor Socrático</a>

    <a href="https://gemini.google.com/gem/1_QnNt0xj4KfFybro9PY351AltrAEk_ri?usp=sharing" target="_blank" class="btn">Simulador</a>

    <a href="https://rpgplayground.com/game/mate" target="_blank" class="btn">Juego de Matemáticas</a>

    <a href="https://www.youtube.com/playlist?list=PLeySRPnY35dEHnMLZGaNEXgHzJ2-TPLWw" target="_blank" class="btn">Curso de Integrales</a>

    <div class="section">
      <div class="section-title">Integrantes</div>
      <div class="names">
       Miguel Alejandro Benitez Mancilla
       Ethan Haziel Ramirez Lugo
       Angel Yeudiel Ramirez Sanchez
       Angel Misael Sanchez Herrera
       Ricardo Morales Roldan 
       Omar David Garcia Flores
      </div>
    </div>

  </div>
</body>
</html>
